<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0A0C10" />
    <title>Lost in orbit — 404</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 16px;
             background: #0A0C10; color: #EEF1F6; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      p { color: #B6BECA; margin: 0 0 24px; }
      code { color: #38D9F0; font: 12px ui-monospace, monospace; letter-spacing: .14em; }
      h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 12px 0; letter-spacing: -.03em; }
      a { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 10px;
          background: #38D9F0; color: #0A0C10; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #38D9F0; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <code>ERROR 404</code>
      <h1>Lost in orbit</h1>
      <p>This page drifted out of range.</p>
      <a href="/">Return to the core</a>
    </main>
  </body>
</html>
