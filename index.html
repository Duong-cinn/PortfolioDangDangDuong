    <script>
      // Enable reveal animations only when JS runs; if the app never hydrates, show everything.
      (function (d) {
        d.classList.add("js");
        setTimeout(function () {
          if (!d.dataset.hydrated) d.classList.remove("js");
        }, 4000);
      })(document.documentElement);
    </script>
